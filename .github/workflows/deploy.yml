# Minden main-re küldött push után felépíti és élesíti az oldalt.
#
# A közzététel Cloudflare Pages-re megy (duna-enterior.pages.dev), nem
# GitHub Pages-re. Ok: a Duwras.github.io felhasználói Pages-oldalhoz az
# ertekpontpenzugyek.hu saját domain van kötve, és a projektoldalak ezt
# öröklik — az ügyfél oldala idegen domain alatt látszott volna.
name: Közzététel

on:
  push:
    branches: [main]
  # kézzel is indítható az Actions fülről, ha újra kell futtatni
  workflow_dispatch:

permissions:
  contents: read

# Egyszerre egy közzététel fusson. A futó nem szakad félbe, csak a
# sorban állók közül marad a legutolsó.
concurrency:
  group: kozzetetel
  cancel-in-progress: false

jobs:
  kozzetetel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 371 forráskép, képenként két webes méret — ez a lépés viszi az
      # időt, nagyjából 2-4 perc.
      - run: npm run build

      # A két titok a repó Settings → Secrets and variables → Actions
      # alatt kell hogy legyen. Ha hiányzik, ez a lépés pirosra vált —
      # szándékosan, mert némán elmaradó közzététel rosszabb.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy deploy --project-name duna-enterior --branch main
