name = "duna-urlap"
main = "src/index.js"
compatibility_date = "2026-01-01"

# A workers.dev cím kell — erre küld a weboldal űrlapja.
workers_dev = true
# A verziónkénti előnézeti címek viszont nem: minden új telepítés újabb
# nyilvános URL-t adna ugyanennek a végpontnak, fölöslegesen.
preview_urls = false

# Az üzenetek adatbázisa. A database_id-t a `wrangler d1 create duna-uzenetek`
# írja ki — másold ide, mielőtt először telepítenél.
[[d1_databases]]
binding = "DB"
database_name = "duna-uzenetek"
database_id = "b6b530f4-2723-4eee-8aa1-d282122ac4ec"

[vars]
CIMZETT = "office@dunaenterior.hu"
# A feladó domainjét igazolni kell a Resendben, különben a levél nem megy ki.
FELADO = "Duna Enterior weboldal <urlap@dunaenterior.hu>"

# Titkok — EZEKET NE ide írd, hanem paranccsal:
#   wrangler secret put RESEND_KULCS
#   wrangler secret put RECAPTCHA_SECRET
