<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{cim}} — Duna Belsőépítészet Kft.</title>
<meta name="description" content="{{cim}} — {{kategoria}} referencia a Duna Belsőépítészet Kft. munkáiból, {{kepMeta}}.">
<link rel="icon" href="img/brand/favicon.png">
<!-- A hajtás fölött ténylegesen használt két betűváltozat előre kérve.
     A többi maradhat a CSS feldolgozása utánra. -->
<link rel="preload" href="fonts/cormorant-garamond-300-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/archivo-400-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="rendszer.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!--FEJLEC:referenciak-->

<main id="tartalom">

  <article class="projekt">
    <div class="projekt-fej">
      <div class="projekt-cim">
        <nav class="morzsa jon bal" aria-label="Hol jár">
          <a href="referenciak.html">Referenciák</a>
          <span aria-hidden="true">/</span>
          <span>{{kategoria}}</span>
        </nav>
        <h1>{{cim}}</h1>
        <dl class="projekt-adat jon bal kesik-2">
          <div><dt>Kategória</dt><dd>{{kategoria}}</dd></div>
          <div><dt>{{kepCimke}}</dt><dd><span data-szam="{{kepSzam}}">{{kepSzam}}</span></dd></div>
        </dl>
        <!--KULSO-LINK-->
      </div>
      <!-- A borító lassabban úszik, mint a lap: a kép nagyítva ül a
           keretben, hogy az elmozdulás ne csupasz szélt mutasson. -->
      <figure class="projekt-borito">
        <img src="{{borito}}" alt="{{cim}}" loading="eager" decoding="async"
             data-parallax="-0.05" style="--pnag:1.12">
      </figure>
    </div>

    <section class="szekcio">
      <div class="belul projekt-leiras">
        <p class="felcim jon bal">A projektről</p>
        <div class="szoveg eloszo jon kesik-1">{{leiras}}</div>
      </div>
    </section>

    <section class="szekcio halvany">
      <div class="belul">
        <div class="szekcio-fej">
          <div>
            <p class="felcim jon bal">Galéria</p>
            <h2>{{kepMondat}}</h2>
          </div>
        </div>
        <div class="galeria">
          <!--GALERIA-->
        </div>
      </div>
    </section>

    <section class="szekcio">
      <div class="belul">
        <div class="szekcio-fej">
          <div>
            <p class="felcim jon bal">Hasonló munkák</p>
            <h2>Ugyanebben a kategóriában.</h2>
          </div>
          <a class="link-nyil jon jobb kesik-2" href="referenciak.html">Összes referencia <span aria-hidden="true">→</span></a>
        </div>
        <div class="racs">
          <!--HASONLO-->
        </div>
      </div>
    </section>
  </article>

</main>

<!-- képnagyító -->
<dialog class="nagyito" id="nagyito" aria-label="Kép nagyban">
  <button class="nagyito-zar" id="nagyitoZar" aria-label="Bezárás">✕</button>
  <button class="nagyito-lep elozo" id="nagyitoElozo" aria-label="Előző kép">‹</button>
  <img id="nagyitoKep" alt="">
  <button class="nagyito-lep kovetkezo" id="nagyitoKovetkezo" aria-label="Következő kép">›</button>
  <p class="nagyito-szam" id="nagyitoSzam"></p>
</dialog>

<!--LABLEC-->

<script src="script.js"></script>
<script src="galeria.js"></script>
</body>
</html>
