<!-- KTK 2020 útmutató, 3.2.3. pont (14. o.): „Az ún. infoblokknak
     mindig kiemelt helyen kell szerepelnie a honlapon, azaz a
     láthatósági területen kell lennie, megnyitáskor, görgetést nem
     igénylő pozícióban.” A lábléc önmagában tehát NEM elég — ez a
     példány a lap tetején, a fejléc alatt ül, minden lapon.

     Ugyanennek az útmutatónak az általános arculati előírása (12., 14.
     és 22. o.): ha a kedvezményezett további logót használ, „az EU-logónak
     legalább akkora méretűnek kell lennie (magasságban, vagy
     szélességben), mint az EU-logón kívül használt bármely legnagyobb
     méretű logónak”. A blokkon belül az EU-zászló a teljes szélesség
     10,5%-ának megfelelő magasságú, ezért a blokk szélessége és a
     fejléclogó magassága együtt mozog — lásd style.css, --eu-blokk-szel
     és --logo-mag. A méretezést a CSS végzi; a width/height itt a natív
     forrásarány (400×276), hogy ne ugráljon a tördelés betöltés közben.

     A kép ugyanaz a forrás, mint a láblécben; a srcset gyökérből
     indul, mert a build mélységjavítója csak a src-t és a href-et
     írja át. Az arculati kézikönyv 8.5 (WEB) fejezete színes
     változatot és legalább 150 px szélességet ír elő.

     A gomb teljesen elteszi a blokkot, de a döntést semmi nem őrzi meg:
     a szabály a megnyitás pillanatára szól, tehát minden lapnyitás a
     teljes blokkal indul. A `hidden` azért van rajta, mert JavaScript
     nélkül nincs mit vezérelnie — olyankor a blokk marad nyitva, azaz
     a kötelező méretben. -->
